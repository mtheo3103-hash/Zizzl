<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zizzl - Party Games</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

  <div class="comic-bg"></div>

  <!-- Audio-Steuerung -->
  <button id="music-toggle" class="btn-icon" onclick="toggleMusic()" aria-label="Musik umschalten">
    <svg id="music-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
    </svg>
  </button>

  <main class="app-container">
    
    <!-- Header -->
    <header class="logo-wrapper">
      <h1 class="logo">ZIZZL<span>!</span></h1>
      <p class="tagline">Lobby erstellen • Freunde battlen • Freistunde retten</p>
    </header>

    <!-- Warnmeldungen -->
    <div id="alert-box" class="alert-banner hidden"></div>

    <!-- SCHRITT 1: Willkommen & Profil -->
    <section id="screen-welcome" class="card active">
      <div class="input-group">
        <label for="username">DEIN AVATAR / NAME</label>
        <input type="text" id="username" placeholder="z.B. PausenProfi" maxlength="12" />
      </div>

      <div class="divider"><span>SPIELEN</span></div>

      <div class="action-buttons">
        <button class="btn btn-primary btn-bounce" onclick="showJoinInput()">
          <svg class="btn-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
          LOBBY BEITRETEN
        </button>
        <button class="btn btn-secondary" onclick="createLobby()">
          <svg class="btn-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
          LOBBY ERSTELLEN (HOST)
        </button>
      </div>

      <div id="join-box" class="join-box hidden">
        <input type="text" id="game-pin" placeholder="GAME-PIN (z.B. A7X9)" maxlength="5" />
        <button class="btn btn-accent" onclick="joinLobby()">
          LOS! 
          <svg class="btn-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </section>

    <!-- SCHRITT 2: Lobby Screen -->
    <section id="screen-lobby" class="card hidden">
      <div class="lobby-header">
        <div class="pin-display">
          <span>GAME PIN:</span>
          <h2 id="display-pin">----</h2>
        </div>
        <div id="connection-status" class="status-badge">Verbinde...</div>
      </div>

      <div class="player-list-container">
        <h3>SPIELER IN DER LOBBY (<span id="player-count">0</span>)</h3>
        <div id="player-grid" class="player-grid"></div>
      </div>

      <!-- Host-Steuerung -->
      <div id="host-controls" class="host-panel hidden">
        <div class="setting-row">
          <label for="round-select">RUNDENZAHL:</label>
          <select id="round-select">
            <option value="3">3 Runden</option>
            <option value="5" selected>5 Runden</option>
            <option value="10">10 Runden</option>
          </select>
        </div>

        <div class="game-selector-container">
          <label>SPIELE AUSWÄHLEN (MIT VORSCHAU):</label>
          <div class="game-cards-grid">
            
            <label class="game-preview-card active">
              <input type="checkbox" value="snake" checked onchange="toggleCardSelection(this)" />
              <div class="card-visual snake-bg">
                <div class="snake-preview-icon"></div>
              </div>
              <div class="card-title">Snake Rush</div>
            </label>

            <label class="game-preview-card active">
              <input type="checkbox" value="speedtyping" checked onchange="toggleCardSelection(this)" />
              <div class="card-visual typing-bg">
                <span class="typing-preview-text">A B C</span>
              </div>
              <div class="card-title">Speedtyping</div>
            </label>

            <label class="game-preview-card active">
              <input type="checkbox" value="flappy" checked onchange="toggleCardSelection(this)" />
              <div class="card-visual flappy-bg">
                <div class="bird-preview-icon"></div>
              </div>
              <div class="card-title">Flappy Bird</div>
            </label>

            <label class="game-preview-card active">
              <input type="checkbox" value="reaction" checked onchange="toggleCardSelection(this)" />
              <div class="card-visual reaction-bg">
                <div class="flash-preview-icon"></div>
              </div>
              <div class="card-title">Reflex Test</div>
            </label>

          </div>
        </div>

        <button class="btn btn-primary btn-bounce" onclick="startGame()">
          <svg class="btn-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          SPIEL JETZT STARTEN
        </button>
      </div>

      <p id="client-wait-msg" class="wait-msg">Warte darauf, dass der Host das Spiel startet...</p>
    </section>

    <!-- SCHRITT 3: Spielbereich -->
    <section id="screen-game" class="card hidden">
      <div class="game-header">
        <span id="round-indicator">Runde 1 / 5</span>
        <span id="game-title">Snake Rush</span>
      </div>
      
      <div id="game-viewport" class="game-viewport"></div>

      <div id="live-leaderboard" class="leaderboard-box">
        <div class="leaderboard-header">
          <svg class="icon-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0011 15.9V18H8v2h8v-2h-3v-2.1c2.16-.4 3.84-2.11 3.99-4.36E12 11c2.47-.31 4.39-2.39 4.39-4.94V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg>
          <span>LIVE RANKING</span>
        </div>
        <ol id="leaderboard-list"></ol>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>

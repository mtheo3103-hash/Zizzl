<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Zizzl - Fast Casual Party Games</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Socket.io CDNs -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

  <!-- Comic Background Pattern -->
  <div class="comic-bg"></div>

  <!-- Audio Controls Button -->
  <button id="music-toggle" class="btn-icon" onclick="toggleMusic()">
    <svg id="music-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
    </svg>
  </button>

  <main class="app-container">
    
    <!-- Logo Header -->
    <header class="logo-wrapper">
      <h1 class="logo">ZIZZL<span>!</span></h1>
      <p class="tagline">Lobby erstellen • Freunde battlen • Freistunde retten</p>
    </header>

    <!-- STEP 1: Main Menu / Profile -->
    <section id="screen-welcome" class="card active">
      <div class="input-group">
        <label for="username">DEIN AVATAR / NAME</label>
        <input type="text" id="username" placeholder="z.B. PausenProfi" maxlength="12" />
      </div>

      <div class="divider"><span>SPIELEN</span></div>

      <div class="action-buttons">
        <button class="btn btn-primary btn-bounce" onclick="showJoinInput()">
          <svg class="btn-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
          LOBBY BEITRETEN
        </button>
        <button class="btn btn-secondary" onclick="createLobby()">
          <svg class="btn-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>
          LOBBY ERSTELLEN (HOST)
        </button>
      </div>

      <!-- Join Pin Input Box -->
      <div id="join-box" class="join-box hidden">
        <input type="text" id="game-pin" placeholder="GAME-PIN (z.B. A7X9)" maxlength="5" />
        <button class="btn btn-accent" onclick="joinLobby()">
          LOS! 
          <svg class="btn-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </section>

    <!-- STEP 2: Lobby Screen -->
    <section id="screen-lobby" class="card hidden">
      <div class="lobby-header">
        <div class="pin-display">
          <span>GAME PIN:</span>
          <h2 id="display-pin">----</h2>
        </div>
        <div id="connection-status" class="status-badge">Verbinde...</div>
      </div>

      <div class="player-list-container">
        <h3>SPIELER IN DER LOBBY (<span id="player-count">0</span>)</h3>
        <div id="player-grid" class="player-grid"></div>
      </div>

      <!-- Controls for Host only -->
      <div id="host-controls" class="host-panel hidden">
        <div class="setting-row">
          <label for="round-select">Rundenzahl:</label>
          <select id="round-select">
            <option value="3">3 Runden</option>
            <option value="5" selected>5 Runden</option>
            <option value="10">10 Runden</option>
          </select>
        </div>

        <div class="game-selector-container">
          <label>SPIELE AUSWÄHLEN:</label>
          <div class="game-checkboxes">
            <label class="game-option">
              <input type="checkbox" value="snake" checked />
              <span>Snake Rush</span>
            </label>
            <label class="game-option">
              <input type="checkbox" value="speedtyping" checked />
              <span>Speedtyping</span>
            </label>
            <label class="game-option">
              <input type="checkbox" value="flappy" checked />
              <span>Flappy Bird</span>
            </label>
            <label class="game-option">
              <input type="checkbox" value="reaction" checked />
              <span>Reflex Test</span>
            </label>
          </div>
        </div>

        <button class="btn btn-primary btn-bounce" onclick="startGame()">
          <svg class="btn-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          SPIEL JETZT STARTEN
        </button>
      </div>

      <p id="client-wait-msg" class="wait-msg">Warte darauf, dass der Host das Spiel startet...</p>
    </section>

    <!-- STEP 3: Game Area -->
    <section id="screen-game" class="card hidden">
      <div class="game-header">
        <span id="round-indicator">Runde 1 / 5</span>
        <span id="game-title">Snake Rush</span>
      </div>
      
      <div id="game-viewport" class="game-viewport">
        <!-- Minispiel HTML/Canvas lädt hier -->
      </div>

      <!-- Live-Ranking -->
      <div id="live-leaderboard" class="leaderboard-box">
        <h3>🏆 LIVE RANKING</h3>
        <ol id="leaderboard-list"></ol>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
